name: verifiers

# The trust channel's own checks, on every change: the published SHA256SUMS still match the files,
# and the outer verifiers' regression tests pass (identity-point / small-order / non-canonical keys
# refused; no verifier takes its key from the document it verifies). Every uses: is pinned to a
# full commit SHA (the trailing # vN is the readable version).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: SHA256SUMS match the published files
        run: sha256sum -c SHA256SUMS
      - name: Outer verifier regression tests
        run: |
          python -m pip install --quiet pytest==8.4.2
          python -m pytest verifiers/test_outer_verifiers.py -q -p no:cacheprovider
